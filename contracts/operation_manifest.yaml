  - operation_id: get_file
    display_name: Get Telegram File
    description: Download a file the bot can see, by its Telegram file_id, into a workflow artifact. Telegram serves files up to 20 MB and keeps the download link valid for about an hour; the step downloads at once. A larger file is refused, never cut.
    operation_kind: source
    category: notification
    connection_type_ids:
    - telegram_bot
    workflow_visible: true
    inputs:
    - name: connection_ref
      value_type: connection_ref
      required: true
    - name: file_id
      value_type: text
      required: true
      display_name: Telegram file ID
      description: The file_id of a file the bot can see, for example the file_id of a New Telegram message trigger. Telegram serves files up to 20 MB.
    outputs:
    - name: artifact_handle
      value_type: artifact_handle
      display_name: File
      description: The downloaded file as a workflow artifact.
    - name: artifact_filename
      value_type: text
      display_name: File name
      description: The file's name as Telegram stores it.
    - name: size_bytes
      value_type: integer
      display_name: Size in bytes
      description: The size of the downloaded file.
    - name: sha256
      value_type: text
      display_name: SHA-256
      description: The checksum of the downloaded file.
    result_fields:
    - result.artifact_handle
    - result.artifact_filename
    - result.size_bytes
    - result.sha256
    error_codes:
    - file_id_required
    - project_connection_required
    - bot_token_or_chat_id_required
    - file_too_large
    - telegram_file_not_found
    - telegram_download_failed
    - artifact_write_failed
    - telegram_request_rejected
    - telegram_rate_limited
    - telegram_send_ambiguous
    - telegram_request_failed
