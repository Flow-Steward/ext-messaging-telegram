operations:
  - operation_id: send_message
    display_name: Send Message
    description: Post a message from the workflow to one of this bot's Telegram channels.
    operation_kind: action
    category: notification
    connection_type_ids: [telegram_bot]
    workflow_visible: true
    inputs:
      - {name: connection_ref, value_type: connection_ref, required: true}
      - name: channel_id
        value_type: text
        required: false
        display_name: Channel ID
        description: The ID of a channel on the Chats & Channels page. May be left empty when only one channel is enabled for notifications.
      - name: text
        value_type: text
        required: true
        display_name: Message
        description: The text to send, at most 4096 characters. A Template step's result fits here.
      - name: format
        value_type: text
        required: false
        display_name: Format
        description: text sends the message as written; html reads Telegram's HTML tags (b, i, u, s, a, code, pre, blockquote).
      - name: disable_web_page_preview
        value_type: boolean
        required: false
        display_name: No link preview
        description: Leave out the preview Telegram shows for the first link. Defaults to the connection setting.
      - name: reply_to_message_id
        value_type: integer
        required: false
        display_name: Reply to message ID
        description: Send as a reply to this Telegram message ID. Leave empty for a normal message.
      - name: disable_notification
        value_type: boolean
        required: false
        display_name: Silent
        description: Deliver without a notification sound.
      - name: buttons
        value_type: array
        required: false
        display_name: Buttons
        description: 'Inline keyboard: a list of rows, each a list of buttons {"text": "Open", "url": "https://..."} or {"text": "Go", "callback_data": "my_data"}. callback_data is at most 64 bytes and may not start with "tgx:".'
        schema:
          type: array
          items:
            type: array
            items:
              type: object
              properties:
                text: {type: string}
                url: {type: string}
                callback_data: {type: string}
    outputs:
      - {name: delivered, value_type: boolean, display_name: Delivered, description: Whether Telegram accepted the message.}
      - {name: provider_message_id, value_type: text, display_name: Telegram message ID, description: The message ID Telegram returned.}
      - {name: channel_id, value_type: text, display_name: Channel ID, description: The channel the message went to.}
      - {name: external_effect_status, value_type: text}
    result_fields:
      - result.delivered
      - result.provider_message_id
      - result.channel_id
    error_codes:
      - text_required
      - format_invalid
      - project_connection_required
      - no_notify_channel
      - channel_id_required
      - unknown_channel_id
      - channel_disabled
      - channel_missing_notify
      - message_too_long
      - reply_to_message_id_invalid
      - keyboard_invalid
      - bot_token_or_chat_id_required
      - telegram_send_ambiguous
      - telegram_send_rejected
      - telegram_send_request_invalid
      - telegram_reply_target_invalid
  - operation_id: deliver_notification
    display_name: Deliver Notification
    description: Internal notification-provider delivery contract.
    operation_kind: action
    category: notification
    workflow_visible: false
    inputs:
      - {name: event, value_type: object, required: true}
      - {name: route, value_type: object, required: true}
    outputs:
      - {name: delivered, value_type: boolean}
      - {name: provider_message_id, value_type: text}
  - operation_id: send_file
    display_name: Send File
    description: Send a file from the workflow to one of this bot's Telegram channels as a photo, document, video, audio, voice message or animation. Photos up to 10 MB, other kinds up to 50 MB; a larger file is refused, never cut.
    operation_kind: action
    category: notification
    connection_type_ids:
    - telegram_bot
    workflow_visible: true
    inputs:
    - name: connection_ref
      value_type: connection_ref
      required: true
    - name: channel_id
      value_type: text
      required: false
      display_name: Channel ID
      description: The ID of a channel on the Chats & Channels page. May be left empty when only one channel is enabled for notifications.
    - name: kind
      value_type: text
      required: true
      display_name: Kind
      description: 'How Telegram shows the file: photo, document, video, audio, voice or animation. A photo is limited to 10 MB, every other kind to 50 MB.'
    - name: artifact_handle
      value_type: artifact_handle
      required: true
      display_name: File
      description: The file (an artifact) to send, for example one a Fetch File or Get Telegram file step produced.
    - name: caption
      value_type: text
      required: false
      display_name: Caption
      description: Optional text under the file, at most 1024 characters.
    - name: format
      value_type: text
      required: false
      display_name: Format
      description: text sends the message as written; html reads Telegram's HTML tags (b, i, u, s, a, code, pre, blockquote).
    - name: file_name
      value_type: text
      required: false
      display_name: File name
      description: The name Telegram shows for the file. Defaults to the artifact's name.
    - name: reply_to_message_id
      value_type: integer
      required: false
      display_name: Reply to message ID
      description: Send as a reply to this Telegram message ID. Leave empty for a normal message.
    - name: disable_notification
      value_type: boolean
      required: false
      display_name: Silent
      description: Deliver without a notification sound.
    outputs:
    - name: delivered
      value_type: boolean
      display_name: Delivered
      description: Whether Telegram accepted the request.
    - name: provider_message_id
      value_type: text
      display_name: Telegram message ID
      description: The ID of the message the step sent or acted on.
    - name: channel_id
      value_type: text
      display_name: Channel ID
      description: The channel the step used.
    - name: external_effect_status
      value_type: text
    result_fields:
    - result.delivered
    - result.provider_message_id
    - result.channel_id
    error_codes:
    - kind_invalid
    - artifact_required
    - format_invalid
    - caption_too_long
    - reply_to_message_id_invalid
    - project_connection_required
    - no_notify_channel
    - channel_id_required
    - unknown_channel_id
    - channel_disabled
    - channel_missing_notify
    - file_too_large
    - artifact_read_failed
    - artifact_empty
    - telegram_file_too_large
    - telegram_markup_invalid
    - telegram_reply_target_invalid
    - bot_token_or_chat_id_required
    - telegram_send_ambiguous
    - telegram_request_rejected
    - telegram_rate_limited
    - telegram_chat_not_found
    - telegram_bot_not_in_chat
    - telegram_not_enough_rights
    - telegram_request_failed
