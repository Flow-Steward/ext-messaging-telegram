- action_id: get_file
  workflow_visible: true
  title: Get Telegram File
  description: Download a file the bot can see, by its Telegram file_id, into a workflow artifact. Telegram serves files up to 20 MB and keeps the download link valid for about an hour; the step downloads at once. A larger file is refused, never cut.
  required_scopes:
  - extension:invoke
  - artifact:write
  handler:
    mode: extension
  mutates_platform: false
  parameters:
  - name: file_id
    type: string
    required: true
    description: The file_id of a file the bot can see, for example the file_id of a New Telegram message trigger. Telegram serves files up to 20 MB.
  result_fields:
  - artifact_handle
  - artifact_filename
  - size_bytes
  - sha256
  error_codes:
  - file_id_required
  - project_connection_required
  - bot_token_or_chat_id_required
  - file_too_large
  - telegram_file_not_found
  - telegram_download_failed
  - artifact_write_failed
  - telegram_request_rejected
  - telegram_rate_limited
  - telegram_send_ambiguous
  - telegram_request_failed
