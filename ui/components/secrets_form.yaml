component_id: secrets_form
anchor_id: secrets_form
type: form
title: Bot Token
description: Required. The token authenticates the bot, not your Telegram account. It is treated like a password, encrypted at rest, and never displayed after save.
schema_ref: ../../schemas/secrets.schema.yaml
ui_schema:
  version: '1'
  type: form_ui
  layout:
    columns: 1
  sections:
  - section_id: secrets
    title: Bot Token
    variant: card
    field_ids:
    - bot_token
  fields:
  - field_id: bot_token
    path: bot_token
    widget: secret
    section_id: secrets
    label: Bot Token
    placeholder: 123456:ABC-DEF1234...
    help: Bot API token from @BotFather. It authenticates the bot, is encrypted at rest, and is never displayed after save. Leave the field empty to keep the stored token; enter a new one to replace it.
  actions:
    save_label: Save token
    verify:
      action_id: verify_bot_token
      label: Verify
data:
  load_query: get_secrets
  save_action: save_secrets
  save_mode: patch
