component.inbound_intro.content: 'Gaunamos žinutės neprivalomos: išsiunčiamiems pranešimams jų nereikia. Konfigūruokite tik Telegram atsakymams, mygtukams ir žmogaus patvirtinimo ar atmetimo srautams.


