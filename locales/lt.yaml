page.inbound.title: Gaunami
page.inbound.description: Neprivaloma. Reikalinga tik Telegram atsakymams, mygtukams ir patvirtinimo, atmetimo ar nutraukimo sprendimams.
component.inbound_intro.title: Gaunamos žinutės neprivalomos
component.inbound_intro.content: 'Gaunamos žinutės neprivalomos: išsiunčiamiems pranešimams jų nereikia. Konfigūruokite tik Telegram atsakymams, mygtukams ir žmogaus patvirtinimo ar atmetimo srautams.


  **Polling** patogus vietinėms instaliacijoms ir nereikalauja viešo adreso. **Webhook** reikalauja viešo HTTPS grįžtamojo ryšio adreso ir gauna atnaujinimus iš karto. **Auto** renkasi veikiantį webhook, o jam neveikiant naudoja polling. Nesukonfigūruotas gaunamų žinučių kelias nėra klaida.'
