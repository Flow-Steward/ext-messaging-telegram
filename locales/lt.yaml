component.setup_guide.title: Išsamus vadovas
component.setup_guide.content: '## Viešų pokalbių nustatymas


  Viešas pokalbis ar kanalas turi vartotojo vardą. Įklijuokite `@vardas` arba `https://t.me/vardas` puslapyje „Pokalbiai ir kanalai“ ir spauskite **Nustatyti**: botas tiesiogiai paklaus Telegram apie pokalbį, žinutės nereikia.


  ## Privačių pokalbių ir grupių paieška


  Privatūs pokalbiai, grupės ir privatūs kanalai neturi viešo vardo. Pridėkite botą į pokalbį, parašykite ten bet kokią žinutę ir spauskite **Rasti per Telegram** arba **Atnaujinti rastus pokalbius**. Paieška skaito laukiančius atnaujinimus per sukonfigūruotą gaunamų žinučių kelią (polling arba webhook), todėl mato tik tuos pokalbius, kuriuose po boto prisijungimo buvo atnaujinimų.


  ## Kanalo teisės


  Kad galėtų skelbti kanale, botas turi būti administratorius su teise skelbti žinutes. Grupėse jis turi būti narys; kad skaitytų atsakymus grupėse, jam taip pat turi būti leista matyti žinutes (išjungtas privatumo režimas arba kreipiamasi tiesiogiai). Išsaugotas kanalas atskirai skelbia `notify` ir `human_decision` galimybes.


  ## Polling ar webhook


  Polling klausia Telegram atnaujinimų tam tikru intervalu ir nereikalauja viešo adreso; tai patogu vietinėms ir privačioms instaliacijoms. Webhook leidžia Telegram siųsti atnaujinimus į viešą HTTPS grįžtamojo ryšio adresą ir labiau tinka gamybai. Abu neprivalomi: išsiunčiami pranešimai veikia ir be jų.


  ## Rakto atšaukimas


  Raktas yra boto slaptažodis. Jei jis galėjo nutekėti, atšaukite jį @BotFather komanda `/revoke`, tada įklijuokite naują raktą į Boto rakto kortelę ir išsaugokite. Išsaugant naują raktą kanalai, maršrutai ir gaunamų žinučių nustatymai išlieka; tuščias rakto laukas niekada neperrašo išsaugoto rakto.'
page.chats_channels.title: Pokalbiai ir kanalai
page.chats_channels.description: Raskite pokalbius, kuriuos mato botas, ir išsaugokite juos kaip pavadintas Flow Steward paskirties vietas.
component.chats_intro.title: Pokalbiai ir kanalai
component.chats_intro.content: '**Paieška** randa Telegram pokalbius, kuriuos šiuo metu mato išsaugotas botas: viešus pokalbius pagal vardą, privačius pokalbius ir grupes pagal boto gautus atnaujinimus.


  **Kanalas** išsaugo vieną pokalbį kaip pastovią, pavadintą Flow Steward paskirties vietą. Kanalas gali atskirai skelbti pranešimų ir žmogaus sprendimų galimybes. Bandomajam pranešimui reikia išsaugoto rakto ir įjungto kanalo.'
