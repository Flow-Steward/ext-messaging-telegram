component.secrets_form.field.bot_token.help: Bot API raktas iš @BotFather. Jis autentifikuoja botą, saugomas šifruotas ir po išsaugojimo nerodomas. Palikite lauką tuščią, kad liktų išsaugotas raktas; įveskite naują, kad jį pakeistumėte.
