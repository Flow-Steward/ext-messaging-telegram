component.health_panel.title: Parengtis
component.telegram_overview.title: Apie
component.telegram_overview.content: 'Siunčia projekto įvykius į Telegram pokalbius per Bot API: užduočių klaidas ir užbaigimus, patvirtinimo užklausas ir sprendimus. Kiekvienas projektas susieja savo boto raktą ir pavadintus kanalus; atsakymai ir patvirtinimo, atmetimo ar nutraukimo sprendimai grįžta per neprivalomą gaunamų žinučių kelią.


  Pradėkite nuo **Nustatymų**, tada **Pokalbiai ir kanalai**. **Gaunami** reikalingi tik dvipusiams srautams.'
