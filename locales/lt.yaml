component.quick_start.title: Greita pradžia
component.quick_start.content: '1. Telegram programėlėje atidarykite patvirtintą [@BotFather](https://t.me/BotFather) paskyrą.

  2. Paleiskite `/newbot` ir pagal Telegram nurodymus pavadinkite botą.

  3. Nukopijuokite sugeneruotą Bot API raktą į **Boto raktas** kortelę žemiau.

  4. Išsaugokite raktą ir mygtuku **Patikrinti** patvirtinkite aptiktą boto vardą.

  5. Pridėkite botą į tikslinį pokalbį ar kanalą. Privačiuose pokalbiuose ir grupėse parašykite ten žinutę, kad paieška turėtų ką perskaityti.

  6. Pereikite į **Pokalbiai ir kanalai** ir išsaugokite rastą pokalbį kaip pavadintą Flow Steward paskirties vietą.

  7. **Gaunamus** konfigūruokite tik tada, kai reikia atsakymų arba žmogaus sprendimų (patvirtinti, atmesti, nutraukti).


  Oficialus Telegram vadovas: [Bot tutorial](https://core.telegram.org/bots/tutorial).'
