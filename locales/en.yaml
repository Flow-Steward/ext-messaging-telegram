page.inbound.title: Inbound
page.inbound.description: Optional. Needed only for Telegram replies, callback buttons and approve/reject/abort decisions.
component.inbound_intro.title: Inbound is optional
component.inbound_intro.content: 'Inbound is optional: outbound notifications do not need it. Configure it only for Telegram replies, callback buttons, and human-in-the-loop approve/reject flows.


  **Polling** is convenient for local setups and needs no public address. **Webhook** requires a public HTTPS callback URL and receives updates as they happen. **Auto** prefers a healthy webhook and falls back to polling. An unconfigured inbound path is not an error.'
