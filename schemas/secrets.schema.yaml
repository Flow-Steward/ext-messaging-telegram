$schema: https://json-schema.org/draft/2020-12/schema
title: Telegram Notification Provider Secrets
description: Secret values resolved via provider_runtime secret resolution. Stored
  in provider_secrets, never in config.
type: object
properties:
  bot_token:
    type: string
    description: Telegram Bot API token from @BotFather, resolved only by the canonical
      bot_token secret key.
    examples:
    - 123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11
required:
- bot_token
additionalProperties: false
